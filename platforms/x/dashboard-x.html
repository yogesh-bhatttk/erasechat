<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erasechat — X</title>
  <link rel="stylesheet" href="../shared/dashboard-base.css">
  <style>
    body {
      background: #000;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dashboard-overlay {
      position: relative;
      width: 100vw;
      height: 100vh;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      background: url('/icons/icon128.png') no-repeat center center fixed; 
      background-size: cover;
    }
    .dashboard-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--bg-overlay);
      backdrop-filter: blur(15px);
    }
    .dashboard-modal {
      position: relative;
      z-index: 10;
      width: 90vw;
      max-width: 1000px;
      height: 85vh;
      max-height: 800px;
      transform: none !important;
      margin: 0 auto;
      top: 50%;
      transform: translateY(-50%) !important;
    }
  </style>
</head>
<body>
  <div class="dashboard-overlay">
    <div class="dashboard-modal">
      <div class="dashboard-header">
        <div class="header-left">
          <div class="brand-title">
            <img src="/icons/icon48.png" width="24" height="24" alt="logo" style="border-radius: 6px;">
            <h2>Erasechat — X</h2>
            <span id="connected-as" style="font-size: 12px; color: #8e8e93; margin-left: 8px;"></span>
          </div>
        </div>
      </div>
      <div class="dashboard-body">
        <div class="dashboard-main">
          <div class="config-grid">
            <div class="panel-card filter-form">
              <h3 class="panel-title" data-i18n="dashSearchFilters">1. Search Filters</h3>
              <p class="panel-subtitle" data-i18n="dashFilterDepthNote">Only a keyword filter is available here. Slack's dashboard also has sender, date range, attachments, and /regex/ filters.</p>

          <div class="form-group">
            <label for="username" data-i18n="xDashUsernameLabel">Your X.com Username</label>
            <input type="text" id="username" placeholder="e.g. elonmusk" data-i18n-ph="xDashUsernamePlaceholder">
          </div>
          <div class="form-group">
            <label for="text-filter" data-i18n="dashTextMatchPlain">Text Filter (Optional — plain text, no /regex/)</label>
            <input type="text" id="text-filter" placeholder="Keyword or Phrase" data-i18n-ph="dashKeywordPlaceholder">
          </div>

              <button id="scan-btn" class="dashboard-btn btn-scan" style="margin-top: 15px; justify-content: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span data-i18n="dashScan">Scan Messages</span>
              </button>
            </div>

            <div class="results-panel">
              <div class="results-header">
                <h4 data-i18n="dashPreviewResults">Preview Results</h4>
                <div class="results-selector" id="results-count">0 items found</div>
              </div>
              <div class="results-list" id="item-list">
                <div class="no-messages" data-i18n="dashScanPromptEmpty">Enter parameters and click Scan to begin.</div>
              </div>
            </div>
          </div>

          <div class="action-panel">
            <div class="selected-channel-summary">
              <h4 data-i18n="dashReadyToDelete">Ready to delete?</h4>
              <p id="status-text" data-i18n="dashUnrecoverableWarning">Items deleted will be unrecoverable.</p>
              <p id="progress-text" style="color: #1d9bf0; margin-top: 4px; font-weight: bold; font-size: 11px;"></p>
            </div>
            <div class="action-buttons">
              <button id="sc-btn-cancel" class="dashboard-btn" hidden data-i18n="dashCancel">Cancel</button>
              <button id="delete-btn" class="dashboard-btn btn-delete danger" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                <span data-i18n="dashStartDeleting">Start Deleting</span>
              </button>
            </div>
          </div>

          <div class="activity-log" id="sc-activity-log">
            <button type="button" class="activity-log-toggle">
              <span data-i18n="dashActivityLog">Activity Log</span>
              <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="activity-log-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/dashboard-fetch-utils.js"></script>
  <script src="dashboard-x.js"></script>
</body>
</html>
