# Keep the toolchain current without hand-watching it.
#
# Dev tooling (ESLint, Playwright, webpack, ...) never ships to users, so those updates
# only touch the test/lint gate and are safe to take routinely once CI is green.
# The one runtime dependency, teleproto (the MTProto client bundled into the Telegram
# pages, which holds the user's auth key), is kept OUT of that group so it always
# arrives as its own PR: a teleproto bump needs a manual review of the upstream diff
# and the rebuilt bundle (see CONTRIBUTING.md "Pinned dependencies"), and must never
# block -- or ride along with -- routine tooling updates. 1.229.1, for example, was a
# 101-file rewrite that also pulled in Node-only `timers/promises` and broke the build.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # ESLint and Playwright move on their own cadences; one PR per tool keeps a
      # failure attributable instead of bisecting a combined bump.
      dev-tooling:
        patterns: ["*"]
        exclude-patterns: ["teleproto"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # upload-artifact and download-artifact MUST move together. The release job
      # downloads the artifact the verify job uploaded, and GitHub has shipped
      # breaking changes across artifact majors before (a v4 artifact cannot be read
      # by v3). Bumping one alone leaves the pair mismatched across majors — and CI
      # would not catch it, because download-artifact is used only by the tag-gated
      # release job, so an ordinary PR check goes green either way. Grouping them
      # means a version skew never reaches main as a "passing" PR.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
