name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. The release job below opts itself up to contents:write, so the
# build-and-test path can never write to the repo even if it is compromised.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 = current LTS. The floor is 20.19 (see package.json engines); the test
          # runner's glob support and ESLint 10 both need a recent 20.x at minimum.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (correctness rules)
        run: npm run lint

      - name: Unit + packaging tests
        run: npm test

      # --with-deps also installs xvfb on Ubuntu runners, which the headful step needs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Browser extensions cannot be loaded by a headless browser, so the e2e specs
      # launch a headful Chromium — which needs a virtual display on CI. Fall back to a
      # direct run if xvfb is somehow unavailable, so a missing display utility surfaces
      # as a real test failure rather than a confusing "command not found".
      - name: End-to-end tests (loads the unpacked extension)
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run --auto-servernum npm run test:e2e
          else
            echo "::warning::xvfb-run not found; running e2e without a virtual display"
            npm run test:e2e
          fi

      - name: Build both store packages
        run: npm run build

      # Catches manifest properties AMO rejects before a submission burns a review cycle.
      - name: Validate Firefox package (addons-linter)
        run: npm run validate:firefox

      - name: Upload store packages
        uses: actions/upload-artifact@v7
        with:
          name: store-packages
          path: dist/*.zip
          if-no-files-found: error

  # Publishing step: turns a `v*` tag into a GitHub Release carrying the exact zips
  # that just passed the gate above. It reuses the verified artifact rather than
  # rebuilding, so what is published is bit-for-bit what was tested.
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with the manifests would publish zips whose internal
      # version does not match the release they are attached to — and the stores
      # reject a re-upload of an already-used version, so this is expensive to undo.
      # npm test already pins the three version fields to each other; this pins the
      # tag to them.
      - name: Verify the tag matches the packaged version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${tag_version}, but manifest.json says ${manifest_version}. Run 'npm run version:set ${tag_version}' and re-tag."
            exit 1
          fi
          echo "Tag and manifest agree on v${manifest_version}."

      - uses: actions/download-artifact@v7
        with:
          name: store-packages
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -1sh dist/*.zip
          # --verify-tag refuses to invent a tag if the ref somehow does not exist.
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --verify-tag \
            --title "Erasechat $GITHUB_REF_NAME" \
            --notes "Store packages for \`$GITHUB_REF_NAME\`, built from this tag after the full gate passed (lint, unit + packaging tests, Playwright e2e, both builds, addons-linter).

          - \`erasechat-chrome-*.zip\` — Chrome Web Store (MV3 service worker)
          - \`erasechat-firefox-*.zip\` — Firefox AMO (MV3 event page)

          See [CHANGELOG.md](CHANGELOG.md) for what changed, and \`store-assets/SUBMISSION_CHECKLIST.md\` for the submission steps."
